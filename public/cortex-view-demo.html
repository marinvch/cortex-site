<title>Cortex — Cortex</title>

<script>try{var t=localStorage.getItem("cortex-view-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{color-scheme:light;--bg:#f2f3f5;--surface:#ffffff;--surface-2:#eceef1;--raised:#fbfbfc;--ink:#1b140d;--ink-2:#3a2e22;--ink-3:#4a3b2c;--label:#6b3300;--acc:#733700;--acc-soft:rgba(115,55,0,.09);--on-acc:#ffffff;--ok:#054d2c;--bad:#861726;--warn:#5c3d00;--focus:#733700;--line:rgba(60,40,20,.26);--line-2:rgba(60,40,20,.13);--shadow:0 1px 2px rgba(60,40,20,.08),0 10px 28px -14px rgba(60,40,20,.25);--edge:120,90,60;--band:rgba(60,40,20,.045);--cvshadow:rgba(60,40,20,.16);--edge-rest:.12;--edge-w:.7;--bundle:.3;--glow:184,92,0;--glow-hot:110,46,0;--link:rgba(140,80,20,.16);--blend:source-over;--c-ctx:#a35300;--c-code:#2a62c4;--c-test:#0b7a47;--c-gen:#6c43c9;--t-ctx:#fbead6;--t-code:#e4ecfa;--t-test:#dff3e7;--t-gen:#eee7fb;}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#17110b;--surface:#1f1710;--surface-2:#2a2016;--raised:#271d14;--ink:#fbf3e8;--ink-2:#eadbc6;--ink-3:#d4bd9e;--label:#ffc98a;--acc:#ffb05a;--acc-soft:rgba(255,176,90,.14);--on-acc:#1a0f04;--ok:#7ee2a8;--bad:#ffaba1;--warn:#ffd479;--focus:#ffd9a8;--line:rgba(255,196,130,.26);--line-2:rgba(255,196,130,.13);--shadow:0 1px 2px rgba(0,0,0,.5),0 14px 36px -18px rgba(0,0,0,.8);--edge:255,190,120;--band:rgba(255,196,130,.05);--cvshadow:rgba(0,0,0,.5);--edge-rest:.24;--edge-w:1;--bundle:.42;--glow:255,150,50;--glow-hot:255,232,196;--link:rgba(255,160,80,.085);--blend:lighter;--c-ctx:#ffb05a;--c-code:#7fb2ff;--c-test:#7ee2a8;--c-gen:#c7a6ff;--t-ctx:#3a2710;--t-code:#1b2a3f;--t-test:#15311f;--t-gen:#2d2140;}}
:root[data-theme=dark]{color-scheme:dark;--bg:#17110b;--surface:#1f1710;--surface-2:#2a2016;--raised:#271d14;--ink:#fbf3e8;--ink-2:#eadbc6;--ink-3:#d4bd9e;--label:#ffc98a;--acc:#ffb05a;--acc-soft:rgba(255,176,90,.14);--on-acc:#1a0f04;--ok:#7ee2a8;--bad:#ffaba1;--warn:#ffd479;--focus:#ffd9a8;--line:rgba(255,196,130,.26);--line-2:rgba(255,196,130,.13);--shadow:0 1px 2px rgba(0,0,0,.5),0 14px 36px -18px rgba(0,0,0,.8);--edge:255,190,120;--band:rgba(255,196,130,.05);--cvshadow:rgba(0,0,0,.5);--edge-rest:.24;--edge-w:1;--bundle:.42;--glow:255,150,50;--glow-hot:255,232,196;--link:rgba(255,160,80,.085);--blend:lighter;--c-ctx:#ffb05a;--c-code:#7fb2ff;--c-test:#7ee2a8;--c-gen:#c7a6ff;--t-ctx:#3a2710;--t-code:#1b2a3f;--t-test:#15311f;--t-gen:#2d2140;}
*{box-sizing:border-box}
/* The cooling animation settles instantly under this too — see REDUCED in both scripts. */
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important;animation-duration:0s!important}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* A column: the bar takes the height it needs and the views take the rest. The views were sized
   the viewport minus 60px against a bar fixed at 60px, which is a promise a phone cannot keep — the bar
   has to wrap there, and a fixed height either clips it or pushes the page past the screen. */
body{overflow:hidden;display:flex;flex-direction:column}
code,.mono{font-family:"Cascadia Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px}
button{font:inherit;color:inherit}
/* Focus is drawn, always, in a colour chosen to be seen — never left to a browser default that is
   a 1px dotted line on some platforms and nothing at all on others. */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── top bar ─────────────────────────────────────────────────────────── */
#top{display:flex;align-items:center;gap:18px;padding:0 20px;min-height:60px;flex:0 0 auto;
  border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:20}
#brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
#brand b{font:600 22px/1 Bahnschrift,"DIN Alternate","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.24em;color:var(--ink)}
#brand span{font-size:15px;color:var(--ink-2)}
#tabs{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{appearance:none;border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;
  color:var(--ink-2);font-size:14px;font-weight:550;white-space:nowrap;transition:color .12s,background .12s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab.on{color:var(--ink);background:var(--surface-2);box-shadow:inset 0 -3px 0 var(--acc)}
#q{margin-left:auto;width:240px;min-width:140px;padding:8px 12px 8px 34px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a0784a' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") no-repeat 10px 50%/15px;
  color:var(--ink);font-size:14px;transition:border-color .12s,box-shadow .12s}
#q:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
#q::placeholder{color:var(--ink-3)}
#theme{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:7px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
#theme:hover{border-color:var(--acc)}

/* ── layout ──────────────────────────────────────────────────────────── */
#main{flex:1 1 auto;min-height:0}
.view{display:none;height:100%;position:relative}
.view.on{display:flex}
.pane{flex:1;overflow-y:auto;padding:30px 34px 60px;scrollbar-width:thin}
.wrap{max-width:900px}

/* The canvas takes its layout size from CSS, never from its width/height attributes — sizing the
   attribute off getBoundingClientRect while the attribute also drives layout is a feedback loop,
   and the page grows a horizontal scrollbar a pixel at a time. */
#cv{position:absolute;inset:0;display:block;cursor:grab;width:100%;height:100%}
#cv:active{cursor:grabbing}

/* ── overview ────────────────────────────────────────────────────────── */
#v-ov.on{display:grid;grid-template-columns:minmax(290px,340px) minmax(0,1fr) minmax(300px,370px);
  grid-template-rows:auto minmax(0,1fr)}
#ovbar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 24px;
  border-bottom:1px solid var(--line-2)}
.st{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border:1px solid var(--line);border-radius:99px;
  font-size:13.5px;color:var(--ink);background:var(--surface);white-space:nowrap}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:0 0 9px}
.st.ok::before{background:var(--ok)}.st.warn::before{background:var(--warn)}.st.bad::before{background:var(--bad)}
#ovbar .when{margin-left:auto;font-size:14px;color:var(--ink-2);white-space:nowrap}
#ovbar .when b{color:var(--ink);font-family:"Cascadia Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-weight:500;font-size:13.5px}
.col{overflow-y:auto;padding:22px 24px 40px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;min-height:0}
#ovl{border-right:1px solid var(--line-2)}#ovr{border-left:1px solid var(--line-2)}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 14px;font:600 14px/1.2 Bahnschrift,"DIN Alternate","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  letter-spacing:.16em;text-transform:uppercase;color:var(--label)}
.sh small{font:500 13px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;letter-spacing:.02em;text-transform:none;color:var(--ink-2)}
.sh::after{content:"";flex:1;height:1px;background:var(--line)}
.sh.gap{margin-top:30px}
.vt{padding:0 0 15px;margin:0 0 15px;border-bottom:1px solid var(--line-2)}
.vk{display:flex;align-items:baseline;gap:8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);font-weight:600}
.vk .aside{margin-left:auto;letter-spacing:.02em;text-transform:none;font-weight:500;text-align:right}
.vv{font:600 40px/1.1 Bahnschrift,"DIN Alternate","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.01em;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.vv small{font-size:18px;color:var(--ink-2);margin-left:8px;letter-spacing:.04em}
.bar{height:8px;border-radius:99px;background:var(--surface-2);margin-top:9px;overflow:hidden;border:1px solid var(--line-2)}
.bar i{display:block;height:100%;background:var(--acc)}
.spark{display:block;width:100%;height:44px;margin-top:8px;color:var(--acc);overflow:visible}
.spark .fill{fill:var(--acc-soft);stroke:none}
.spark-x{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:3px}
.sev{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.sev span{padding:3px 10px;border-radius:7px;border:1px solid var(--line);font-size:13.5px;color:var(--ink)}
.sev b{font-variant-numeric:tabular-nums;margin-right:4px}
.sev .critical b,.sev .high b{color:var(--bad)}.sev .medium b{color:var(--warn)}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:12px;padding:8px 0;font-size:14.5px;color:var(--ink);line-height:1.45}
.chk .box{flex:0 0 16px;height:16px;margin-top:3px;border:2px solid var(--ink-2);border-radius:3px}
.chk .sv{display:block;font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.chk .sv.medium{color:var(--warn)}.chk .sv.high,.chk .sv.critical{color:var(--bad)}
.na{color:var(--ink-2);font-size:14px;margin:6px 0;padding-left:10px;border-left:3px solid var(--warn);line-height:1.5}
#ovc{position:relative;min-width:0;min-height:0;overflow:hidden}
#ov{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#ov:active{cursor:grabbing}
#ovcap{position:absolute;left:24px;top:18px;right:190px;max-width:560px;font-size:14px;line-height:1.5;
  color:var(--ink-2);pointer-events:none;text-shadow:0 0 8px var(--bg),0 0 3px var(--bg),0 0 1px var(--bg)}
#ovcap b{color:var(--ink)}
/* Zoom is buttons first: a wheel over the cloud has to keep scrolling the page it sits in. */
#ovz{position:absolute;right:16px;top:16px;display:flex;gap:6px}
#ovz button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;
  min-width:40px;height:40px;padding:0 10px;font-size:16px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
#ovz button:hover:not(:disabled){border-color:var(--acc)}
#ovz button:disabled{opacity:.45;cursor:default}
#hero{position:absolute;left:0;right:0;bottom:0;padding:64px 20px 22px;text-align:center;pointer-events:none;
  background:linear-gradient(to top,var(--bg) 0,var(--bg) 60%,transparent)}
#hero .lbl{font:600 15px Bahnschrift,"DIN Alternate","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--label)}
#hero .big{font:600 84px/1 Bahnschrift,"DIN Alternate","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;margin:6px 0 10px}
#hero .rule{width:min(520px,70%);height:2px;margin:0 auto 12px;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
#hero .strip{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 26px;font-size:14px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2)}
#hero .strip b{color:var(--ink);letter-spacing:.02em;margin-right:6px}
.here{border:1px solid var(--acc);background:var(--acc-soft);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.here .k{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--label);font-weight:600}
.here .t{font-size:16px;font-weight:600;color:var(--ink);margin:3px 0 4px}
.here .w{font-size:14px;color:var(--ink-2);line-height:1.5;margin-bottom:10px}
.deck{display:flex;flex-wrap:wrap;gap:6px 8px}
.deck-h{font-size:13px;color:var(--ink-2);margin:16px 0 8px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.cmd{appearance:none;display:flex;align-items:center;gap:9px;width:auto;max-width:100%;text-align:left;border:1px solid var(--line);
  background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;font:500 13.5px "Cascadia Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;color:var(--ink)}
.cmd::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--acc)}
.cmd .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd:hover{border-color:var(--acc)}
.cmd.copied{border-color:var(--ok)}.cmd.copied::before{background:var(--ok)}
.here .cmd{display:inline-flex;width:auto;max-width:100%}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);
  font-size:14px;line-height:1.45}
.tl .when{font:500 13px/1.45 "Cascadia Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;color:var(--label);font-variant-numeric:tabular-nums}
.tl .when small{display:block;font-size:13px;color:var(--ink-2)}
.tl .tag{display:block;font:500 13px/1.45 "Cascadia Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;color:var(--ink-2)}
.tl li.memory .tag{color:var(--acc)}
.tl .tt{color:var(--ink);overflow-wrap:anywhere}
.hint2{font-size:14px;color:var(--ink-2);margin:12px 0 0;line-height:1.5}

/* ── structure ───────────────────────────────────────────────────────── */
.skey{display:flex;flex-wrap:wrap;gap:10px 22px;margin:0 0 26px;font-size:14px;color:var(--ink)}
.skey span{display:inline-flex;align-items:center;gap:8px}
.skey i{width:18px;height:18px;border-radius:5px;border:2px solid var(--c);background:var(--t);display:inline-block}
.skey .dash i{border-style:dashed;background:transparent;border-color:var(--ink-2)}
#stree{position:relative;min-width:960px;padding-bottom:20px}
#swires{position:absolute;left:0;top:0;pointer-events:none;color:var(--ink-3);overflow:visible}
.srow{display:flex;justify-content:center;margin-bottom:58px}
.scols{display:grid;grid-template-columns:230px minmax(0,1fr) 230px;gap:44px;align-items:start}
.scol{display:flex;flex-direction:column;gap:10px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:40px 16px;margin-top:48px}
.sarea{display:flex;flex-direction:column;gap:8px}
.sb{appearance:none;display:block;width:100%;text-align:left;border:2px solid var(--c);background:var(--t);border-radius:10px;
  padding:9px 13px;color:var(--ink);font:500 14.5px/1.35 "Cascadia Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;position:relative;margin:0}
.sb small{display:block;font:500 13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color:var(--ink-2);margin-top:2px}
.sb .nm{overflow-wrap:anywhere}
button.sb{cursor:pointer}button.sb:hover{box-shadow:0 0 0 3px var(--acc-soft)}
.k-ctx{--c:var(--c-ctx);--t:var(--t-ctx)}.k-code{--c:var(--c-code);--t:var(--t-code)}
.k-test{--c:var(--c-test);--t:var(--t-test)}.k-gen{--c:var(--c-gen);--t:var(--t-gen)}
.sb.root{width:auto;min-width:320px;text-align:center;font-size:20px;font-weight:600;padding:14px 30px}
.sb.head{text-align:center;font:600 15px/1.3 Bahnschrift,"DIN Alternate","Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.sb.head small{letter-spacing:.02em;text-transform:none}
.sb.area{font-size:16px;font-weight:600;padding-left:24px}
.sb.area::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:6px;border-radius:3px;background:var(--sw)}
.sb.leaf{border-width:1px;font-size:13.5px;padding:7px 11px}
.sb.missing{border-style:dashed;background:transparent}
.sother{margin-top:36px;font-size:14px;color:var(--ink-2)}
.sother .chip{cursor:default}

/* ── the Map: a bar, the canvas, and the legend beside it ────────────── */
/* The legend is a column of its own, never an overlay: floating over the canvas it covered the
   right end of the graph, and reserving a gutter for it left the graph on two-thirds of the screen. */
#mapmain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#cvwrap{position:relative;flex:1 1 auto;min-height:0}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 16px;font-size:13.5px;color:var(--ink-2);
  border-bottom:1px solid var(--line-2);background:var(--bg)}
#hud b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
#hud .grp,#hud .zm{display:inline-flex;align-items:center;gap:6px}
#hud .zm{margin-left:auto}
#hud .msel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hud .msel b{font-family:"Cascadia Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-weight:500;font-size:13.5px}
#hud button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 10px;
  font-size:13.5px;cursor:pointer;color:var(--ink);min-width:34px;font-variant-numeric:tabular-nums}
#hud button:hover{border-color:var(--acc)}
#hud button.on{border-color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc);font-weight:600}
#legend{flex:0 0 300px;width:300px;overflow-y:auto;padding:12px 14px 24px;font-size:13.5px;
  border-left:1px solid var(--line-2);background:var(--surface);scrollbar-width:thin}
#legend.min{flex:0 0 auto;width:auto;padding:12px 10px}
#legend.min .lgb{display:none}
.lgt{appearance:none;display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);
  border-radius:8px;padding:5px 10px;margin:0 0 10px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
#legend.min .lgt{margin:0}
.lgh{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--label);font-weight:600;margin:0 0 6px}
.lgh small{letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink-2);margin-left:4px}
#legend .lg{display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 6px;margin:0 -6px;border-radius:6px;
  color:var(--ink);transition:background .1s,color .1s;user-select:none}
#legend .lg:hover{background:var(--surface-2)}
#legend .lg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* A hidden row is struck through, not faded: fading text is how a label drops under 7:1. */
#legend .lg.off{text-decoration:line-through;color:var(--ink-2)}
#legend .lg.off .sw{background:transparent!important;outline:2px solid var(--ink-2);outline-offset:-2px}
#legend .lg .sw{width:11px;height:11px;border-radius:3px;flex:0 0 11px}
#legend .lg .ct{margin-left:auto;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:13px}
#legend .note{margin-top:10px;padding-top:4px;border-top:1px solid var(--line-2);color:var(--ink-2);font-size:13px;line-height:1.5}
#legend .note p{margin:8px 0 0}
.cl-areas{display:flex;flex-wrap:wrap;gap:0}
#tip{position:fixed;pointer-events:none;background:var(--raised);border:1px solid var(--line);
  border-radius:11px;box-shadow:var(--shadow);padding:10px 12px;font-size:13.5px;max-width:min(340px,calc(100vw - 24px));display:none;z-index:40}
#tip .t{font-weight:600;margin-bottom:3px;word-break:break-all;color:var(--ink)}

  h+='<div class="scol">'+B({k:'k-code',cls:'head',id:'s-ha',from:'s-root',t:'Code areas',
    s:(()=>{const b=code.filter(a=>a.brief&&!a.root).length;
      return plural(code.length,'area')+(code.length===1?' holds':' hold')+' code · '+fmt(b)+(b===1?' has':' have')+' a scoped brief';})()});
  h+='<div class="sgrid">'+shown.map((a,i)=>{let c='<div class="sarea">'+B({k:'k-code',cls:'area',id:'s-a'+i,from:'s-ha',sw:a.color,t:a.root?'top-level files':a.name+'/',s:plural(a.files,'file')+' · '+fmt(a.code)+' code'});
    if(a.root)c+=a.brief?B({k:'k-ctx',cls:'leaf',t:a.brief,s:'the root brief covers these',go:a.brief})
      :B({k:'k-ctx',cls:'leaf missing',t:'no root AGENTS.md',s:'/write-context-docs writes it'});
    else if(a.brief)c+=B({k:'k-ctx',cls:'leaf',t:a.brief,s:'scoped brief',go:a.brief});
    // A dashed box names a command, so it is drawn only where the findings report would offer one.
    // Everything else is covered by the brief above it, and says which.
    else if(a.suggest)c+=B({k:'k-ctx',cls:'leaf missing',t:'no scoped brief',s:a.suggest});
    else c+=B({k:'k-ctx',cls:'leaf',t:a.inherits?'covered by '+a.inherits:'no scoped brief',s:'too small to need its own brief',go:a.inherits||''});
    for(const f of a.key)c+=B({k:'k-code',cls:'leaf',t:f.label||base(f.path),s:'imported by '+fmt(f.inbound),go:f.path});
    // Tests are counted the way the findings report counts them — by coverage, wherever the tests
    // live — so a src/ area exercised from a top-level tests/ is not called untested.
    if(a.tests)c+=B({k:'k-test',cls:'leaf',t:plural(a.tests,'test file'),s:'in '+a.name+'/'});
    if(a.testable)c+=a.tested?B({k:'k-test',cls:'leaf',t:fmt(a.tested)+' of '+plural(a.testable,'code file'),s:'have a test found'})
      :B({k:'k-test',cls:'leaf missing',t:'no test found',s:'for its '+plural(a.testable,'code file')});
    return c+'</div>';}).join('')+'</div>';
  if(code.length>shown.length)h+='<p class="sother">'+plural(code.length-shown.length,'more code area')+' — the Areas tab lists every one.</p>';
  if(docs.length)h+='<div class="sother">Areas with no product code: '+docs.map(a=>'<span class="chip flat">'+esc(a.name)+' · '+fmt(a.files)+(a.tooling?' · agent tooling':'')+'</span>').join('')+'</div>';
  h+='</div>';
  // Right: what Cortex generates.
  h+='<div class="scol">'+B({k:'k-gen',cls:'head',id:'s-hg',from:'s-root',t:'Generated',s:'written by Cortex, under .cortex/'});
  if(!O)h+=NA(NOSTATE);
  else for(const g of O.generated)h+=B({k:'k-gen',cls:'leaf'+(g.present?'':' missing'),t:g.path,s:g.what+(g.present?'':' — not written yet')});
  h+='</div></div></div></div>';
  p.innerHTML=h;}
// Arrows are drawn after layout, from the boxes where they actually landed — a tree whose lines are
// computed from assumed sizes points at the wrong box the first time a name wraps.
function wires(){const t=$('stree'),svg=$('swires');if(!t||!svg)return;const b=t.getBoundingClientRect();if(!b.width)return;
  svg.setAttribute('width',b.width);svg.setAttribute('height',b.height);svg.setAttribute('viewBox','0 0 '+b.width+' '+b.height);
  const at=el=>{const r=el.getBoundingClientRect();return{x:r.left-b.left+r.width/2,top:r.top-b.top,bot:r.bottom-b.top};};
  let d='';const els=[...t.querySelectorAll('[data-from]')],first=new Map();
  // Only the first row of a parent's children gets an arrow. A line to the second row of areas has
  // to cross the first to get there, and an arrow drawn through a box points at the wrong one.
  for(const el of els){const f=el.getAttribute('data-from'),top=at(el).top;first.set(f,Math.min(first.has(f)?first.get(f):1e9,top));}
  for(const el of els){const from=$(el.getAttribute('data-from'));if(!from)continue;
    const a=at(from),c=at(el),my=(a.bot+c.top)/2;if(c.top>first.get(el.getAttribute('data-from'))+4)continue;
    d+='<path marker-end="url(#sarr)" d="M'+a.x.toFixed(1)+' '+a.bot.toFixed(1)+' C'+a.x.toFixed(1)+' '+my.toFixed(1)+' '+c.x.toFixed(1)+' '+my.toFixed(1)+' '+c.x.toFixed(1)+' '+(c.top-3).toFixed(1)+'"/>';}
  svg.innerHTML='<defs><marker id="sarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>'
    +'<g fill="none" stroke="currentColor" stroke-width="1.6">'+d+'</g>';}

// ---- theme ---------------------------------------------------------------------------------
const KEY='cortex-view-theme',MQ=typeof matchMedia==='function'?matchMedia('(prefers-color-scheme:dark)'):null;
const theme=()=>root.getAttribute('data-theme')||(MQ&&MQ.matches?'dark':'light');
function paintToggle(){const b=$('theme');if(!b)return;const dark=theme()==='dark';
  b.textContent=dark?'Light theme':'Dark theme';b.setAttribute('aria-label','Switch to the '+(dark?'light':'dark')+' theme');}
$('theme').addEventListener('click',()=>{const next=theme()==='dark'?'light':'dark';root.setAttribute('data-theme',next);
  // Storage can be missing or throw — a private window, a locked-down profile. The choice still
  // applies to this page; it just is not remembered.
  try{localStorage.setItem(KEY,next);}catch(e){}
  retheme();});
if(MQ&&MQ.addEventListener)MQ.addEventListener('change',()=>{if(!root.getAttribute('data-theme'))retheme();});

function show(v){cur=v;visible=v==='ov';if(visible){resize();start();}else{run=false;hideTip();}
  if(v==='structure')requestAnimationFrame(wires);}
addEventListener('resize',()=>{if(visible){resize();if(!run)frame();}if(cur==='structure')wires();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)start();});
$('ovr').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-copy]');if(b)copy(b.getAttribute('data-copy'),b);});
$('spane').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-go]');if(b)go(b.getAttribute('data-go'));});
status();vitals();rightCol();hero();structure();retheme();
window.OV={show,frame,resize,count:n,links:L.length/2,points:()=>[...X,...Y,...Z],
  zoom:step=>{setZoom(zi+step);return zoom;},screen:()=>[...PX]};
show('ov');
})();
</script>
<script>
const $=s=>document.getElementById(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const CHURN=(DATA.gaps&&DATA.gaps.churn)||{known:true};
const commitsOf=n=>n+' commit'+(n===1?'':'s');
const NODE=new Map(DATA.nodes.map(n=>[n.id,n]));
const OUT=new Map(),IN=new Map();
const push=(m,k,v)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(v);};
for(const l of DATA.links){push(OUT,l.source,l.target);push(IN,l.target,l.source);}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// The Overview opens first. The Map is built while it is hidden and fitted the first time it is
// shown, because a canvas in a display:none view has no size to fit to.
let TAB='ov';
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showTab(t.dataset.v));
function showTab(v){TAB=v;document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.v===v;
    t.classList.toggle('on',on);t.setAttribute('aria-selected',on?'true':'false');});
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$('v-'+v).classList.add('on');if(v==='map')resize();
  // The Overview script owns the cloud and the Structure tree; it is absent when only this script runs.
  if(typeof OV==='object'&&OV)OV.show(v);}

// ---- file reader -------------------------------------------------------------------------
function openFile(id){const n=NODE.get(id);if(!n)return;showTab('files');
  const outs=(OUT.get(id)||[]).slice().sort(),ins=(IN.get(id)||[]).slice().sort();
  const link=p=>'<span class="chip" tabindex="0" role="button" data-go="'+esc(p)+'"><span class="mono">'+esc(p)+'</span></span>';
  const facts=['area: '+n.area,n.cluster?'cluster: '+n.cluster:'',n.lang,n.category,n.depth!==null?'layer '+n.depth:'',n.isEntry?'entry point':'',n.isTest?'test':'']
    .filter(Boolean).map(t=>'<span class="chip flat">'+esc(t)+'</span>').join('');
  let h='<div class="inner"><h1>'+esc(n.label)+'</h1><div class="path mono">'+esc(n.path)+'</div>';
  h+='<div class="kpi"><div class="k"><b>'+n.lines.toLocaleString()+'</b><span>lines</span></div>'
    +'<div class="k" title="'+esc(CHURN.known?'':CHURN.reason)+'"><b>'+(CHURN.known?n.commits:'—')+'</b><span>commits</span></div>'
    +'<div class="k"><b>'+n.in+'</b><span>imported by</span></div>'
    +'<div class="k"><b>'+n.out+'</b><span>imports</span></div></div>';
  h+='<div style="margin-top:14px">'+facts
    +(n.isTest||n.category!=='code'?'':'<span class="chip flat '+(n.tested?'ok':'bad')+'">'+(n.tested?'✓ test found':'✗ no test found')+'</span>')+'</div>';
  if(n.summary)h+='<h2>What it does</h2><div class="hint" style="color:var(--ink-2)">'+esc(n.summary)
    +(n.role?'<br><b>Role:</b> '+esc(n.role):'')+'</div>'
    +(n.tags&&n.tags.length?'<div>'+n.tags.map(t=>'<span class="chip flat">'+esc(t)+'</span>').join('')+'</div>':'');
  h+='<h2>Imported by · '+ins.length+'</h2>'+(ins.length?ins.map(link).join('')
    :'<div class="hint">Nothing resolvable imports this. Import resolution is regex-based, so a dynamic import would not appear here — worth checking, never proof it is dead.</div>');
  h+='<h2>Imports · '+outs.length+'</h2>'+(outs.length?outs.map(link).join(''):'<div class="hint">No resolved imports.</div>');
  const r=$('reader');r.innerHTML=h+'</div>';r.scrollTop=0;
  r.querySelectorAll('.chip[data-go]').forEach(p=>p.onclick=()=>openFile(p.dataset.go));
  document.querySelectorAll('#flist .row').forEach(x=>x.classList.toggle('on',x.dataset.id===id));}

function buildList(q){const L=$('flist');L.innerHTML='';const by={};
  DATA.nodes.filter(n=>!q||n.path.toLowerCase().includes(q)).forEach(n=>{(by[n.area]=by[n.area]||[]).push(n);});
  const keys=Object.keys(by).sort();
  if(!keys.length){L.innerHTML='<div class="hint" style="padding:14px 9px">No path matches that.</div>';return;}
  keys.forEach(a=>{const h=document.createElement('div');h.className='sect';
    h.innerHTML=esc(a)+'<span class="n">'+by[a].length+'</span>';L.appendChild(h);
    by[a].sort((x,y)=>y.deg-x.deg||x.path.localeCompare(y.path)).forEach(n=>{const d=document.createElement('div');
      d.className='row';d.dataset.id=n.id;d.title=n.path;d.tabIndex=0;d.setAttribute('role','button');
      d.innerHTML='<span class="sw" style="background:'+n.color+'"></span><span class="nm">'+esc(n.label)+'</span>';
      d.onclick=()=>openFile(n.id);L.appendChild(d);});});}

// ---- areas -------------------------------------------------------------------------------
function buildAreas(){let h='<div class="wrap"><h2 class="vh">Areas</h2>'
  +'<div class="hint">The top-level shape of this repo. A scoped <code>AGENTS.md</code> means agents load narrow context for that area instead of the whole root brief — run <code>/write-area-brief &lt;dir&gt;</code> on the ones holding real invariants, not on all of them.</div>';
  DATA.areas.forEach(a=>{h+='<div class="card"><h3><span class="sw" style="background:'+a.color+'"></span>'+esc(a.name)+'</h3>'
    +'<div class="s">'+a.files+' files · '+a.code+' code · '+a.lines.toLocaleString()+' lines</div>'
    +(a.description?'<div class="p">'+esc(a.description)+'</div>':'')
    +'<div class="foot"><span class="chip flat '+(a.hasBrief?'ok':'')+'">'+(a.hasBrief?'✓ '+esc(a.brief||'scoped brief'):'no scoped brief')+'</span></div></div>';});
  // Clusters beside the folders: the same repo cut by what imports what. A cluster spanning
  // several areas is a feature the folder layout splits up; an area split across clusters holds
  // more than one.
  const C=DATA.clusters;
  if(C){h+='<h2 class="vh">Clusters <small class="mono">'+C.items.length+'</small></h2>'
    +'<div class="hint">Files that import each other more than they import the rest of the repo, found by the Leiden method over the import graph. Each is named by its hub, the member with the most import links. Cohesion is the share of member pairs joined by an import: 1 means every file touches every other. '
    +(C.unclustered?Number(C.unclustered).toLocaleString('en-US')+' code files have no import edge Cortex could resolve, so they belong to no cluster.':'')+'</div>';
    h+=C.items.length?'<div class="tw"><table><tr><th>cluster</th><th>hub</th><th>files</th><th>cohesion</th><th>areas</th></tr>'
      +C.items.map(c=>'<tr><td class="num"><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:'+c.color+'"></span>'+esc(c.id)+'</td>'
        +'<td><span class="chip" tabindex="0" role="button" data-go="'+esc(c.hub)+'" title="'+esc(c.hub)+'"><span class="mono">'+esc(c.hubLabel)+'</span></span></td>'
        +'<td class="num">'+c.size+'</td><td class="num">'+c.cohesion+'</td>'
        +'<td><div class="cl-areas">'+c.areas.map(a=>'<span class="chip flat">'+esc(a.name)+' · '+a.files+'</span>').join('')+'</div></td></tr>').join('')
      +'</table></div>':'<div class="hint">None: no two files here import each other.</div>';}
  h+=graphSection(DATA.graph);
  const p=$('apane');p.innerHTML=h+'</div>';
  p.querySelectorAll('.chip[data-go]').forEach(el=>el.onclick=()=>openFile(el.dataset.go));}

// The graph report, under the clusters it is read off: bridges and untested clusters are named by
// cluster id, and the table that defines those ids sits right above.
function graphSection(G){if(!G)return '';
  const go=p=>'<span class="chip" tabindex="0" role="button" data-go="'+esc(p)+'" title="'+esc(p)+'"><span class="mono">'+esc(p)+'</span></span>';
  let h='<h2 class="vh">Hubs <small class="mono">'+G.hubs.length+'</small></h2>'
    +'<div class="hint">The files with the most import links, counting each neighbour once. Tests, fixtures, test helpers and vendored files are left out here and in the bridges below, because a test importing the code it covers says nothing about the code. Files with exactly the same links are one row. Every count is a floor: a dynamic import is invisible to the index.</div>';
  h+=G.hubs.length?'<div class="tw"><table><tr><th>file</th><th>links</th><th>imported by</th><th>cluster</th></tr>'
    +G.hubs.map(x=>'<tr><td>'+go(x.path)+(x.twins.length?'<span class="chip flat" title="'+esc(x.twins.join(', '))+'">+'+x.twins.length+' with the same links</span>':'')+'</td>'
      +'<td class="num">'+x.links+'</td><td class="num">'+x.inbound+'</td><td class="num">'+esc(x.cluster||'—')+'</td></tr>').join('')
    +'</table></div>':'<div class="hint">None: no file has three or more import links.</div>';
  h+='<h2 class="vh">Bridges <small class="mono">'+G.bridgeCount+'</small></h2>'
    +'<div class="hint">Imports from one cluster into another, least expected first: crossing areas scores 2 and crossing clusters 1; an import of a file other clusters share, or a re-export, scores 2 less. Ties go to the pair of clusters with the fewest imports between them. One row per importing file'
    +(G.bridgeCount>G.bridges.length?', '+G.bridges.length+' shown':'')+'.</div>';
  h+=G.bridges.length?'<div class="tw"><table><tr><th>import</th><th>clusters</th><th>score</th><th>why</th></tr>'
    +G.bridges.map(b=>'<tr><td>'+go(b.from)+' → '+go(b.to)+(b.alsoFrom?'<span class="chip flat">+'+b.alsoFrom+' more from this file</span>':'')+'</td>'
      +'<td class="num">'+esc(b.fromCluster)+' → '+esc(b.toCluster)+'</td><td class="num">'+b.score+'</td>'
      +'<td>'+b.reasons.map(esc).join('; ')+'</td></tr>').join('')
    +'</table></div>':'<div class="hint">None: no import crosses from one cluster into another.</div>';
  h+='<h2 class="vh">Import cycles <small class="mono">'+G.cycleCount+'</small></h2>'
    +'<div class="hint">One shortest loop through each group of files that import each other, shortest first. Breaking an edge on the loop is where to start'
    +(G.cycleCount>G.cycles.length?'; the first '+G.cycles.length+' are listed, and the Gaps tab names every file':'')+'.'
    +(G.testCycles?' Not listed: '+G.testCycles+' cycle'+(G.testCycles===1?'':'s')+' among tests, fixtures and test helpers only.':'')+'</div>';
  h+=G.cycles.length?G.cycles.map(c=>'<div class="cl-areas">'+c.loop.map(go).join(' → ')+' → '+go(c.loop[0])
      +(c.size>c.loop.length?'<span class="chip flat">'+c.size+' files in this group</span>':'')+'</div>').join('')
    :'<div class="hint">None.</div>';
  if(G.untestedClusters){h+='<h2 class="vh">Clusters with no test found <small class="mono">'+G.untestedClusters.length+'</small></h2>'
    +'<div class="hint">No name, import or quoted mention ties a test to any member that needs one. A floor, like every coverage figure here.</div>';
    h+=G.untestedClusters.length?'<div class="tw"><table><tr><th>cluster</th><th>hub</th><th>files that need a test</th></tr>'
      +G.untestedClusters.map(c=>'<tr><td class="num">'+esc(c.id)+'</td><td>'+go(c.hub)+'</td><td class="num">'+c.testable+'</td></tr>').join('')
      +'</table></div>':'<div class="hint">None.</div>';}
  return h;}

// ---- gaps --------------------------------------------------------------------------------
function buildGaps(){const g=DATA.gaps;
  let h='<div class="wrap"><div class="kpi">'
   +'<div class="k"><b>'+DATA.stats.files+'</b><span>files</span></div>'
   +'<div class="k"><b>'+DATA.stats.edges+'</b><span>import edges</span></div>'
   +'<div class="k"><b>'+DATA.stats.tests+'</b><span>tests</span></div>'
   +'<div class="k'+(g.orphans.length?' warn':'')+'"><b>'+g.orphans.length+'</b><span>orphans</span></div>'
   +'<div class="k'+(g.cyclicFiles.length?' bad':'')+'"><b>'+g.cyclicFiles.length+'</b><span>in cycles</span></div>'
   +(DATA.stats.untested!==null&&DATA.stats.untested!==undefined?'<div class="k'+(DATA.stats.untested?' warn':'')+'"><b>'+DATA.stats.untested+'</b><span>no test found</span></div>':'')+'</div>';
  h+='<h2 class="vh">Orphans</h2><div class="hint">Code files nothing imports and which import nothing. Import resolution is regex-based, so dynamic and computed imports are invisible — treat every row as a question, never a delete list.</div>';
  h+=g.orphans.length?g.orphans.map(p=>'<span class="chip" tabindex="0" role="button" data-go="'+esc(p)+'"><span class="mono">'+esc(p)+'</span></span>').join(''):'<div class="hint">None.</div>';
  h+='<h2 class="vh">Files in import cycles</h2><div class="hint">These import each other, directly or through a chain, so they cannot be understood — or tested — one at a time. They also share one layer depth, because mutually importing files genuinely have no order among themselves.</div>';
  h+=g.cyclicFiles.length?g.cyclicFiles.map(p=>'<span class="chip" tabindex="0" role="button" data-go="'+esc(p)+'"><span class="mono">'+esc(p)+'</span></span>').join(''):'<div class="hint">None.</div>';
  const S=DATA.stats,shownU=g.untested.length,allU=S.untested!==null&&S.untested!==undefined?S.untested:shownU;
  const coverHint=' Coverage uses three signals — a test named for the file, a test importing it, or a test naming it in a quoted string — so a file exercised only through a subprocess reads as untested here. That is the safe direction to be wrong in.'
    +(allU>shownU?' The first '+shownU+' of '+allU+' are listed.':'');
  // Ranked by churn only when there is churn. On a shallow clone every file has one commit, and a
  // table ranked by a column of ones is path order wearing the word "busiest".
  if(CHURN.known){
    h+='<h2 class="vh">Busiest code with no test found <small class="mono">'+allU+'</small></h2><div class="hint">Ranked by commits, because churn is where an untested file actually costs you.'+coverHint+'</div>';
    h+=shownU?'<div class="tw"><table><tr><th>file</th><th>commits</th></tr>'+g.untested.map(u=>'<tr><td><span class="chip" data-go="'+esc(u.path)+'"><span class="mono">'+esc(u.path)+'</span></span></td><td class="num">'+u.commits+'</td></tr>').join('')+'</table></div>':'<div class="hint">None.</div>';
  }else{
    h+='<h2 class="vh">Most-imported code with no test found <small class="mono">'+allU+'</small></h2><div class="hint">Ranked by how many files import each one, because churn is not available: '+ic(CHURN.reason)+'.'+coverHint+'</div>';
    h+=shownU?'<div class="tw"><table><tr><th>file</th><th>imported by</th></tr>'+g.untested.map(u=>'<tr><td><span class="chip" data-go="'+esc(u.path)+'"><span class="mono">'+esc(u.path)+'</span></span></td><td class="num">'+(u.inbound||0)+'</td></tr>').join('')+'</table></div>':'<div class="hint">None.</div>';
  }
  h+='<h2 class="vh">Hot spots</h2>';
  if(!CHURN.known)h+='<div class="hint">Not available — '+ic(CHURN.reason)+'.</div>';
  else{h+='<div class="hint">The most-changed code in this repo\'s history — what a new agent, or a new hire, should read first, and where a scoped brief pays for itself.</div>';
    h+='<div class="tw"><table><tr><th>file</th><th>commits</th><th>lines</th><th>test</th></tr>'
     +g.hot.map(f=>'<tr><td><span class="chip" data-go="'+esc(f.path)+'"><span class="mono">'+esc(f.path)+'</span></span></td><td class="num">'+f.commits+'</td><td class="num">'+f.lines+'</td><td class="num" style="color:'+(f.tested?'var(--ok)':'var(--ink-3)')+'">'+(f.tested?'✓':'—')+'</td></tr>').join('')+'</table></div>';}
  const p=$('gpane');p.innerHTML=h+'</div>';
  p.querySelectorAll('.chip[data-go]').forEach(el=>el.onclick=()=>openFile(el.dataset.go));}

// ---- the sequence ------------------------------------------------------------------------
function buildNext(){const n=DATA.next;const p=$('npane');
  if(!n){p.innerHTML='<div class="wrap hint">No sequence data.</div>';return;}
  let h='<div class="wrap"><h2 class="vh">Where this repo is</h2>'
   +'<div class="hint">'+n.done+' of '+n.total+' required steps — the number cortex-next prints; optional steps are ticked but not counted. Every ✓ is a file on disk, not a guess — run the highlighted command next.</div>'
   +'<div class="prog"><i style="width:'+Math.round(n.done/n.total*100)+'%"></i></div>';
  n.steps.forEach(s=>{const mk=s.done?'✓':s.next?'→':'';
    h+='<div class="step'+(s.done?' done':'')+(s.next?' next':'')+'"><div class="mk">'+mk+'</div><div style="min-width:0">'
     +'<div class="ti">'+esc(s.title)
     +(s.optional?'<span class="badge">optional</span>':'')
     +(s.blocking?'<span class="badge hot">do this first</span>':'')
     +(s.next?'<span class="badge hot">you are here</span>':'')+'</div>'
     +'<div class="wy">'+ic(s.why)+'</div>'

  h+='<div class="tw"><table><tr><th>when</th><th>run</th></tr>'+n.perChange.map(r=>'<tr><td>'+esc(r.when)+'</td><td><code>'+esc(r.cmd)+'</code></td></tr>').join('')+'</table></div>';

// ---- map ---------------------------------------------------------------------------------
// Files are grouped, and each group is one box on the full width of the canvas. By cluster when the
// index has clusters: a box is a set of files that import each other, so its colour names a feature
// and its files sit together. Rows by import depth scattered every cluster across every row, and
// colouring by cluster then looked random. Area and depth are the other two groupings, through the
// same packer. The layout is a projection, not a simulation: the same index on the same canvas gives
// the same positions, and nothing moves once placed.
const cv=$('cv'),ctx=cv.getContext('2d'),tip=$('tip');
const UIF='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const MONO='"Cascadia Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace';
const TITLE='600 13px '+UIF,NAME='500 13px '+MONO,PILL='600 13px '+UIF;
const GREY='#8b97ab';
const N=DATA.nodes.filter(n=>n.inMap).map(n=>({...n,acolor:n.color,x:0,y:0,r:3,g:null,ins:[],outs:[]}));
const M=new Map(N.map(n=>[n.id,n]));
const E=DATA.links.map(l=>({s:M.get(l.source),t:M.get(l.target)})).filter(e=>e.s&&e.t&&e.s!==e.t);
for(const e of E){e.s.outs.push(e.t);e.t.ins.push(e.s);}
for(const n of N)n.ind=n.ins.length;
const byRank=(a,b)=>b.ind-a.ind||b.commits-a.commits||(a.path<b.path?-1:1);
const CL=(DATA.clusters&&DATA.clusters.items)||[],CLI=new Map(CL.map((c,i)=>[c.id,i]));
const RGB=h=>{const v=parseInt(String(h).slice(1),16);return (v>>16&255)+','+(v>>8&255)+','+(v&255);};
let BY=CL.length?'cluster':'area';
const hidden=new Set();
// A cluster colours the file in every grouping but area, so the depth view still shows which
// feature each file in a layer belongs to.
function paint(){for(const n of N){n.color=BY==='area'||!CL.length?n.acolor:n.ccolor;n.rgb=RGB(n.color);}}

const MARGIN=16,GAP=12,PAD=10,HEAD=30,NROW=24,MINW=172,LABEL_MAX=16,PER_CELL=3,HUB_MIN=2,LOD=.8,PILLS=40;
// The pitch between dots is the one thing chosen to fit the height: the width is always the canvas's.
const PITCH=[34,30,28,26,24,22,20,18,16,14,12];
let W=0,H=0,dpr=1,tx=MARGIN,ty=MARGIN,scale=1,touched=false,P=PITCH[0];

let hover=null,hoverG=null,hoverB=null,sel=null,NB=new Set(),MT=new Set(),qOn=false,query='';

// The groups of the current grouping in packing order, and the key that puts a file in one.
function spec(){
  if(BY==='cluster')return{keyOf:n=>n.cluster||'-',groups:[
    ...CL.map(c=>({key:c.id,title:c.id+' · '+c.hubLabel,color:c.color,lead:c.hub,c})),
    {key:'-',title:'no cluster',color:GREY,quiet:true}]};
  if(BY==='area'){const k=new Map(),col=new Map();
    for(const n of N){k.set(n.area,(k.get(n.area)||0)+1);if(!col.has(n.area))col.set(n.area,n.acolor);}
    return{keyOf:n=>n.area,groups:[...k.keys()].sort((a,b)=>k.get(b)-k.get(a)||(a<b?-1:1))
      .map(a=>({key:a,title:a,color:col.get(a)||GREY}))};}
  const d=[...new Set(N.map(n=>n.depth===null?-1:n.depth))].sort((a,b)=>(a<0)-(b<0)||a-b);
  return{keyOf:n=>String(n.depth===null?-1:n.depth),stack:true,groups:d.map(x=>({key:String(x),
    title:x<0?'no layer found':x===0?'layer 0 · foundation':'layer '+x,color:GREY,neutral:true}))};}

function layout(){
  const S=spec(),G=new Map(S.groups.map(g=>[g.key,{...g,members:[],intra:[]}]));
  for(const n of N){n.g=null;const g=G.get(S.keyOf(n));if(g)g.members.push(n);}
  const order=BY==='depth'
    ?(a,b)=>(CLI.has(a.cluster)?CLI.get(a.cluster):1e9)-(CLI.has(b.cluster)?CLI.get(b.cluster):1e9)||byRank(a,b)
    :(a,b)=>(a.depth===null)-(b.depth===null)||(a.depth||0)-(b.depth||0)||byRank(a,b);
  GROUPS=[...G.values()].filter(g=>g.members.length&&!hidden.has(g.key));
  GROUPS.forEach((g,i)=>{g.i=i;g.members.sort(order);for(const n of g.members)n.g=g;
    const l=g.lead&&M.get(g.lead);g.leadNode=l&&l.g===g&&!l.isTest&&!l.testSupport?l:null;});
  // Names go to the most-imported files that are neither tests nor there to serve them, a few per
  // box. A helper every test imports ranks high on inbound count and is still not a key file.
  const named=new Set(),per=new Map();
  for(const n of N.filter(n=>n.g&&!n.isTest&&!n.testSupport&&n.ind>=HUB_MIN&&n!==n.g.leadNode).sort(byRank)){
    if(named.size>=LABEL_MAX)break;const k=per.get(n.g)||0;if(k>=PER_CELL)continue;named.add(n);per.set(n.g,k+1);}
  ctx.font=NAME;
  for(const g of GROUPS){g.named=g.members.filter(n=>named.has(n)).sort(byRank);
    g.rest=g.members.filter(n=>n!==g.leadNode&&!named.has(n));
    for(const n of g.named)n.tw=ctx.measureText(n.label).width;}
  const Wav=Math.max(320,W-2*MARGIN),Hav=Math.max(160,H-2*MARGIN);
  let h=0;for(const p of PITCH){P=p;h=pack(Wav,S.stack);if(h<=Hav)break;}
  BOX={x0:0,y0:0,x1:Wav,y1:h};
  bundle();words();describe();if(sel&&!sel.g)sel=null;if(hover&&!hover.g)hover=null;focusSet();}

// Named files flow left to right on their own rows under the box's title, so a name never sits
// on a dot: the dots start below them.
function flow(g,w){const inner=w-2*PAD;let x=0,row=0;const at=[];
  for(const n of g.named){const iw=Math.min(inner,18+n.tw);if(x>0&&x+iw>inner){row++;x=0;}at.push([x,row]);x+=iw+16;}
  return{rows:g.named.length?row+1:0,at};}
function cellH(g,w){const cols=Math.max(1,Math.floor((w-2*PAD)/P));
  return HEAD+flow(g,w).rows*NROW+Math.ceil(g.rest.length/cols)*P+PAD;}

  for(const g of GROUPS){const cols=Math.max(1,Math.ceil(Math.sqrt(g.rest.length*1.8)));
    const nw=g.named.length?Math.min(360,Math.max(...g.named.map(n=>n.tw))+18+2*PAD):0;
    g.nat=Math.min(Wav,Math.max(MINW,cols*P+2*PAD,nw));
    const alone=!!(stack||g.quiet);
    if(!cur||cur.alone||alone||cur.w+GAP+g.nat>Wav){cur={cells:[],w:-GAP,alone};shelves.push(cur);}
    cur.cells.push(g);cur.w+=GAP+g.nat;}
  CELLS=[];let y=0;
  for(const s of shelves){const w=widths(s.cells,Wav-GAP*(s.cells.length-1));
    const sh=Math.max(...s.cells.map((g,i)=>cellH(g,w[i])));
    let x=0;s.cells.forEach((g,i)=>{place(g,x,y,w[i],sh);x+=w[i]+GAP;});
    y+=sh+GAP;}

// Every shelf spans the whole width. What a shelf has beyond its boxes' natural widths goes to the
// boxes with the most files, so one shelf's boxes end at about the same height.
function widths(cells,avail){const need=cells.map(g=>g.rest.length+1),fixed=new Set();let w=null;
  for(let it=0;it<=cells.length&&!w;it++){let fw=0,fn=0;
    cells.forEach((g,i)=>{if(fixed.has(i))fw+=g.nat;else fn+=need[i];});
    const lam=fn?(avail-fw)/fn:0;let grew=false;
    cells.forEach((g,i)=>{if(!fixed.has(i)&&lam*need[i]<g.nat){fixed.add(i);grew=true;}});
    if(!grew)w=cells.map((g,i)=>fixed.has(i)?g.nat:lam*need[i]);}

  const sum=w.reduce((a,b)=>a+b,0);return sum>0?w.map(x=>x*avail/sum):w;}
function place(g,x,y,w,h){const cell={g,x,y,w,h};CELLS.push(cell);g.cell=cell;
  const big=n=>Math.max(2.6,Math.min(7,2.4+Math.sqrt(n.ind)));
  if(g.leadNode){const n=g.leadNode;n.r=big(n);n.x=x+PAD+7;n.y=y+HEAD/2+1;}
  const f=flow(g,w);
  g.named.forEach((n,i)=>{n.r=big(n);n.x=x+PAD+f.at[i][0]+7;n.y=y+HEAD+f.at[i][1]*NROW+NROW/2;});
  const top=y+HEAD+f.rows*NROW,inner=w-2*PAD,cols=Math.max(1,Math.floor(inner/P));

  g.rest.forEach((n,i)=>{n.r=Math.max(2,Math.min(P/2-2,2.2+Math.sqrt(n.ind)));
    n.x=x+PAD+off+xp/2+(i%cols)*xp;n.y=top+P/2+Math.floor(i/cols)*P;});}

// Imports between two boxes are drawn as one line per pair, its width and its number the count.
// Drawn one by one, 630 imports across a full-width page were a texture: no line could be followed.
// By depth every box spans the width and shares one centre line, so pair lines would pile into one
// column; there the imports are drawn one by one, as light as the ones inside a box.
let CROSS=[];
function bundle(){const by=new Map(),stack=BY==='depth';CROSS=[];
  for(const e of E){const a=e.s.g,b=e.t.g;if(!a||!b)continue;
    if(a===b){a.intra.push(e);continue;}
    if(stack){CROSS.push(e);continue;}
    const p=a.i<b.i?a:b,q=p===a?b:a,k=p.i+'|'+q.i;let B=by.get(k);
    if(!B){B={a:p,b:q,ab:0,ba:0,n:0};by.set(k,B);}

  BUNDLES=[...by.values()].sort((x,y)=>y.n-x.n||x.a.i-y.a.i||x.b.i-y.b.i);
  for(const B of BUNDLES){const A=B.a.cell,C=B.b.cell,x1=A.x+A.w/2,y1=A.y+A.h/2,x2=C.x+C.w/2,y2=C.y+C.h/2;
    const len=Math.hypot(x2-x1,y2-y1)||1,bend=Math.min(120,len*.18);
    // Bent, so a line between two boxes of one shelf passes beside the boxes between them, not through.

      w:Math.min(9,1.2+1.4*Math.sqrt(B.n))});}}

const hit=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
const dotBox=n=>({x:n.x-n.r-2,y:n.y-n.r-2,w:2*n.r+4,h:2*n.r+4});
// A word is placed only where it covers no dot and no other word, and dropped otherwise.
function free(b,lists){if(b.x<BOX.x0||b.y<BOX.y0||b.x+b.w>BOX.x1||b.y+b.h>BOX.y1)return false;
  for(const L of lists)for(const l of L)if(hit(b,l))return false;
  for(const c of CELLS){if(!hit(b,c))continue;for(const n of c.g.members)if(hit(b,dotBox(n)))return false;}
  return true;}
function fitText(s,max,font){ctx.font=font;if(ctx.measureText(s).width<=max)return s;let lo=0,hi=s.length;
  while(lo<hi){const m=(lo+hi+1)>>1;if(ctx.measureText(s.slice(0,m)+'…').width<=max)lo=m;else hi=m-1;}
  return lo?s.slice(0,lo)+'…':'';}
function word(kind,text,x,y,font,ref){ctx.font=font;return{kind,text,x,y,w:ctx.measureText(text).width,h:18,font,...ref};}
function pills(list,taken){const out=[];
  for(const B of list){ctx.font=PILL;const t=String(B.n),w=ctx.measureText(t).width+14,h=20;
    for(const s of [.5,.42,.58,.34,.66]){const u=1-s,px=u*u*B.x1+2*u*s*B.qx+s*s*B.x2,py=u*u*B.y1+2*u*s*B.qy+s*s*B.y2;
      const b={kind:'count',text:t,x:px-w/2,y:py-h/2,w,h,font:PILL,B};
      if(free(b,[taken,out])){out.push(b);break;}}}
  return out;}
function words(){LABELS=[];
  for(const c of CELLS){const g=c.g,x0=c.x+PAD+(g.leadNode?18:0),max=c.x+c.w-PAD-x0;
    const full=g.title+' · '+g.members.length+' files',t=fitText(full,max,TITLE)===full?full:fitText(g.title,max,TITLE);
    if(t)LABELS.push(word('cell',t,x0,c.y+HEAD/2-8,TITLE,{g}));
    for(const n of g.named){const x=n.x+11,s=fitText(n.label,c.x+c.w-PAD-x,NAME);
      if(s)LABELS.push(word('file',s,x,n.y-9,NAME,{n}));}}
  LABELS.push(...pills(BUNDLES.slice(0,PILLS),LABELS));}

function describe(){cv.setAttribute('aria-label','Import map: '+N.length+' code files in '+CELLS.length+' '
  +({cluster:'clusters',area:'areas',depth:'layers'})[BY]+', and '+E.length+' imports between them. '
  +'Arrow keys pan, plus and minus zoom, zero resets, Enter opens the selected file. The Files tab lists every file.');}

// Drawing happens on demand, never in a loop: nothing on the Map moves unless the reader moves it.
let pending=false;
function redraw(){if(pending)return;pending=true;requestAnimationFrame(draw);}
function shapePath(shape,x,y,r){ctx.beginPath();
  if(shape==='square')ctx.rect(x-r,y-r,r*2,r*2);
  else if(shape==='diamond'){ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();}
  else if(shape==='triangle'){ctx.moveTo(x,y-r);ctx.lineTo(x+r*.92,y+r*.72);ctx.lineTo(x-r*.92,y+r*.72);ctx.closePath();}
  else ctx.arc(x,y,r,0,7);}
function arrow(a,b,col){const ang=Math.atan2(b.y-a.y,b.x-a.x),r=b.r+3,ax=b.x-Math.cos(ang)*r,ay=b.y-Math.sin(ang)*r;

  ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax-Math.cos(ang-.42)*7,ay-Math.sin(ang-.42)*7);
  ctx.lineTo(ax-Math.cos(ang+.42)*7,ay-Math.sin(ang+.42)*7);ctx.closePath();ctx.fill();}

  const ink=css('--ink'),ink2=css('--ink-2'),line=css('--line'),line2=css('--line-2'),bad=css('--bad'),raised=css('--raised'),
    band=css('--band'),EC=css('--edge'),ER=+css('--edge-rest')||.12,EW=+css('--edge-w')||.7,BA=+css('--bundle')||.3;

  for(const c of CELLS){const g=c.g;ctx.beginPath();ctx.roundRect(c.x,c.y,c.w,c.h,10);
    if(g.neutral){ctx.fillStyle=band;ctx.fill();}else if(!g.quiet){ctx.fillStyle='rgba('+RGB(g.color)+',.07)';ctx.fill();}
    ctx.setLineDash(g.quiet?[4,4]:[]);ctx.strokeStyle=g===hoverG?ink2:line2;ctx.lineWidth=g===hoverG?1.5:1;ctx.stroke();}

    ctx.strokeStyle='rgba('+(g.neutral?EC:RGB(g.color))+','+(F?ER*.35:ER)+')';ctx.stroke();}

    for(;i<CROSS.length&&CROSS[i].s.rgb===c;i++){ctx.moveTo(CROSS[i].s.x,CROSS[i].s.y);ctx.lineTo(CROSS[i].t.x,CROSS[i].t.y);}
    ctx.strokeStyle='rgba('+c+','+(F?ER*.35:ER)+')';ctx.stroke();}
  const focusB=B=>hoverB===B||(hoverG&&(B.a===hoverG||B.b===hoverG));

    ctx.beginPath();ctx.moveTo(B.x1,B.y1);ctx.quadraticCurveTo(B.qx,B.qy,B.x2,B.y2);ctx.stroke();}

    for(const l of [...LABELS,...FW]){if(l.kind==='count')continue;ctx.font=l.font;
      ctx.strokeText(l.text,l.x,l.y+l.h/2+.5);ctx.fillText(l.text,l.x,l.y+l.h/2+.5);}
    const fixed=LABELS.filter(l=>l.kind!=='count');
    const shown=hoverG||hoverB?pills(BUNDLES.filter(focusB),fixed):F?[]:LABELS.filter(l=>l.kind==='count');
    ctx.textAlign='center';
    for(const p of shown){ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,9);ctx.fillStyle=raised;ctx.fill();
      ctx.strokeStyle=line;ctx.lineWidth=1;ctx.stroke();ctx.font=p.font;ctx.fillStyle=ink;ctx.fillText(p.text,p.x+p.w/2,p.y+p.h/2+.5);}
    ctx.textAlign='left';ctx.textBaseline='alphabetic';}
  ctx.setTransform(dpr,0,0,dpr,0,0);}

// The focused file and its neighbours are named where a name fits: right of the dot, or in the gap
// above or below its row. One that fits nowhere keeps its dot, and the tooltip names it.
let FW=[];
function focusSet(){const F=hover||sel;NB=new Set(F?[...F.outs,...F.ins]:[]);FW=[];
  const s=$('msel');if(s&&s.dataset.id!==(sel?sel.id:'')){s.dataset.id=sel?sel.id:'';
    s.innerHTML=sel?'<b>'+esc(sel.path)+'</b> · imports '+sel.outs.length+' · imported by '+sel.ins.length+' · Enter opens it':'';}
  if(!F)return;
  const fixed=LABELS.filter(l=>l.kind!=='count'),named=new Set(fixed.filter(l=>l.n).map(l=>l.n));
  for(const n of [F,...[...NB].sort(byRank)].slice(0,13)){if(!n.g||n.isTest||n.testSupport||named.has(n)||n===n.g.leadNode)continue;
    ctx.font=NAME;const w=ctx.measureText(n.label).width;
    for(const [x,y] of [[n.x+n.r+4,n.y-9],[n.x-w/2,n.y-P/2-9],[n.x-w/2,n.y+P/2-9]]){
      const b={kind:'focus',text:n.label,x,y,w,h:18,font:NAME,n};if(free(b,[fixed,FW])){FW.push(b);break;}}}}

function setQuery(v){query=v;const q=v.trim().toLowerCase();qOn=!!q;MT=new Set();
  if(q)for(const n of N)if(n.path.toLowerCase().includes(q))MT.add(n.id);

function tw(mx,my){return{x:(mx-tx)/scale,y:(my-ty)/scale};}
// What is under the cursor, in the order it is drawn on top: a dot, a file's name, a count, a title.
function pick(mx,my){const p=tw(mx,my),inside=l=>p.x>=l.x&&p.x<=l.x+l.w&&p.y>=l.y&&p.y<=l.y+l.h;let b=null,bd=1e9;
  for(const n of N){if(!n.g)continue;const dx=n.x-p.x,dy=n.y-p.y,d=dx*dx+dy*dy,r=Math.max(n.r+3,6);if(d<r*r&&d<bd){bd=d;b=n;}}
  if(b)return{n:b};
  for(const l of LABELS){if(!inside(l))continue;if(l.n)return{n:l.n};if(l.B&&!hover&&!sel)return{B:l.B};}
  for(const c of CELLS)if(p.x>=c.x&&p.x<=c.x+c.w&&p.y>=c.y&&p.y<=c.y+HEAD)return{g:c.g};
  return null;}
const names=L=>{const s=L.map(m=>m.label).sort();return s.slice(0,6).map(esc).join(', ')+(s.length>6?' and '+(s.length-6)+' more':'');};
function fileTip(n){return '<div class="t">'+esc(n.path)+'</div><div class="m">'
  +esc(n.area)+(n.cluster?' · cluster <b>'+esc(n.cluster)+'</b>':'')+' · '+esc(n.lang)+' · <b>'+n.lines+'</b> lines'+(CHURN.known?' · <b>'+commitsOf(n.commits).replace(' ','</b> '):'')+'<br>'
  +(n.depth!==null?'layer <b>'+n.depth+'</b> · ':'')+'<b>'+n.in+'</b> imported by · <b>'+n.out+'</b> imports'
  +(n.ins.length?'<br>imported by: '+names(n.ins):'')+(n.outs.length?'<br>imports: '+names(n.outs):'')
  +(n.category==='code'&&!n.isTest?(n.tested?'<br>✓ test found':'<br>✗ no test found'):'')
  +(n.summary?'<br>'+esc(n.summary.slice(0,150)):'')
  +'<br>'+(sel===n?'click again to open it':'click to keep it lit, again to open it')+'</div>';}
function groupTip(g){const B=BUNDLES.filter(b=>b.a===g||b.b===g);
  return '<div class="t">'+esc(g.title)+'</div><div class="m"><b>'+g.members.length+'</b> files'
    +(g.c?' · cohesion <b>'+g.c.cohesion+'</b><br>hub '+esc(g.c.hub)+(g.c.areas.length?'<br>areas: '+g.c.areas.slice(0,4).map(a=>esc(a.name)+' '+a.files).join(', '):''):'')
    +(B.length?B.slice(0,8).map(b=>{const o=b.a===g?b.b:b.a,out=b.a===g?b.ab:b.ba,inn=b.a===g?b.ba:b.ab;
      return '<br>'+esc(o.title)+': imports <b>'+out+'</b> · imported by <b>'+inn+'</b>';}).join('')+(B.length>8?'<br>and '+(B.length-8)+' more boxes':'')
      :'<br>no import to or from another box')+'</div>';}
function bundleTip(B){return '<div class="t">'+esc(B.a.title)+' and '+esc(B.b.title)+'</div><div class="m"><b>'+B.n+'</b> imports between them'
  +'<br>'+esc(B.a.title)+' imports '+esc(B.b.title)+': <b>'+B.ab+'</b><br>'+esc(B.b.title)+' imports '+esc(B.a.title)+': <b>'+B.ba+'</b></div>';}
function tipAt(e,html){tip.style.display='block';const flip=e.clientX>innerWidth-360;
  tip.style.left=(flip?e.clientX-350:e.clientX+16)+'px';tip.style.top=(e.clientY+16)+'px';tip.innerHTML=html;}

let drag=null;
cv.addEventListener('mousedown',e=>{drag={x:e.offsetX,y:e.offsetY,tx,ty,moved:false};});
// The listener is on the window, so it hears the mouse over every tab. Only the Map answers it.
addEventListener('mousemove',e=>{if(TAB!=='map'&&!drag)return;const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(drag){if(Math.abs(mx-drag.x)+Math.abs(my-drag.y)>4)drag.moved=true;
    if(drag.moved){touched=true;tx=drag.tx+mx-drag.x;ty=drag.ty+my-drag.y;tip.style.display='none';redraw();}return;}
  const h=e.target===cv?pick(mx,my):null,n=h&&h.n||null,g=h&&h.g||null,B=h&&h.B||null;
  if(n!==hover||g!==hoverG||B!==hoverB){hover=n;hoverG=g;hoverB=B;focusSet();redraw();}
  if(n)tipAt(e,fileTip(n));else if(g)tipAt(e,groupTip(g));else if(B)tipAt(e,bundleTip(B));else tip.style.display='none';});
addEventListener('mouseup',()=>{if(!drag)return;const d=drag;drag=null;if(d.moved)return;
  const h=pick(d.x,d.y),n=h&&h.n;
  if(n){if(sel===n)openFile(n.id);else{sel=n;focusSet();redraw();}}
  else if(sel&&!(h&&h.g)){sel=null;focusSet();redraw();}});
function zoomLabel(){const r=$('mzr');if(r)r.textContent=Math.round(scale*100)+'%';}
function zoomAt(mx,my,f){const s=Math.max(.4,Math.min(6,scale*f));f=s/scale;tx=mx-(mx-tx)*f;ty=my-(my-ty)*f;scale=s;touched=true;zoomLabel();redraw();}
function home(){scale=1;tx=MARGIN;ty=MARGIN;touched=false;zoomLabel();redraw();}
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.15:1/1.15);},{passive:false});
cv.addEventListener('keydown',e=>{const k=e.key,s=60;
  if(k==='ArrowLeft')tx+=s;else if(k==='ArrowRight')tx-=s;else if(k==='ArrowUp')ty+=s;else if(k==='ArrowDown')ty-=s;
  else if(k==='+'||k==='='){e.preventDefault();zoomAt(W/2,H/2,1.25);return;}
  else if(k==='-'||k==='_'){e.preventDefault();zoomAt(W/2,H/2,1/1.25);return;}
  else if(k==='0'){e.preventDefault();home();return;}
  else if(k==='Enter'&&sel){e.preventDefault();openFile(sel.id);return;}
  else if(k==='Escape'&&sel){sel=null;focusSet();redraw();return;}
  else return;
  e.preventDefault();touched=true;redraw();});
function resize(){const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;
  // Back the canvas with device pixels and draw in CSS pixels, or the Map is soft on every HiDPI screen.
  dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  layout();if(!touched){scale=1;tx=MARGIN;ty=MARGIN;}zoomLabel();redraw();}
addEventListener('resize',()=>{if(TAB==='map')resize();});
$('theme').addEventListener('click',redraw);
if(typeof matchMedia==='function'){const mq=matchMedia('(prefers-color-scheme:dark)');if(mq&&mq.addEventListener)mq.addEventListener('change',redraw);}

const GROUP_BY=CL.length?['cluster','area','depth']:['area','depth'];
function buildHud(){const S=DATA.stats||{};
  $('hud').innerHTML='<span><b>'+(S.mapFiles!==undefined?S.mapFiles:N.length)+'</b> code files</span>'
    +'<span><b>'+(S.mapEdges!==undefined?S.mapEdges:E.length)+'</b> imports between them</span>'
    +'<span class="grp" role="group" aria-label="Group the Map by">Group by '
    +GROUP_BY.map(b=>'<button type="button" data-by="'+b+'" aria-pressed="'+(BY===b)+'"'+(BY===b?' class="on"':'')+'>'+b+'</button>').join('')+'</span>'
    +'<span id="msel" class="msel" aria-live="polite"></span>'
    +'<span class="zm" role="group" aria-label="Zoom the Map"><button type="button" id="mzo" aria-label="Zoom out">−</button>'
    +'<button type="button" id="mzr" aria-label="Reset zoom">100%</button><button type="button" id="mzi" aria-label="Zoom in">+</button></span>';
  $('hud').querySelectorAll('[data-by]').forEach(b=>b.onclick=()=>regroup(b.dataset.by));
  const z=(id,f)=>{const b=$(id);if(b)b.onclick=f;};
  z('mzo',()=>zoomAt(W/2,H/2,1/1.25));z('mzi',()=>zoomAt(W/2,H/2,1.25));z('mzr',home);zoomLabel();}
function regroup(by){if(BY===by)return;BY=by;hidden.clear();sel=null;hover=null;hoverG=null;hoverB=null;focusSet();
  paint();layout();home();buildHud();buildLegend();}

let LEG_OPEN=(typeof innerWidth==='number'?innerWidth:1400)>=900;
function legendRows(){const S=spec(),cnt=new Map();for(const n of N){const k=S.keyOf(n);cnt.set(k,(cnt.get(k)||0)+1);}
  return S.groups.filter(g=>cnt.get(g.key)).map(g=>[g.key,g.color,g.title,cnt.get(g.key)]);}
function buildLegend(){const L=$('legend'),S=DATA.stats||{},A=(DATA.areas||[]).length;
  const drawn=S.mapAreas!==undefined?S.mapAreas:new Set(N.map(n=>n.area)).size,loose=N.filter(n=>!n.cluster).length;
  L.innerHTML='<button type="button" class="lgt" id="lgt" aria-expanded="'+LEG_OPEN+'">'+(LEG_OPEN?'Hide legend':'Legend')+'</button>'
   +'<div class="lgb"><div class="lgh">'+({cluster:'Clusters',area:'Areas',depth:'Import depth'})[BY]+' <small>click a row to hide it</small></div>'
   +legendRows().map(([k,c,label,n])=>'<div class="lg'+(hidden.has(k)?' off':'')+'" tabindex="0" role="button" aria-pressed="'+(!hidden.has(k))+'" data-a="'+esc(k)+'">'
     +'<span class="sw" style="background:'+c+'"></span><span class="nm">'+esc(label)+'</span><span class="ct">'+n+'</span></div>').join('')
   +'<div class="note"><p>'+({cluster:'Each box is a cluster: files that import each other more than they import the rest of the repo, named by its hub, the file with the most import links.',
       area:'Each box is an area, the same areas the Overview and the Areas tab count.',
       depth:'Each box is one import depth. Layer 0 is what the rest is built on.'})[BY]+'</p>'
   +'<p>A dot is a code file, larger the more files import it. The most-imported files that are not tests are named; a test is never named. A red ring means no test was found.</p>'
   +(BY==='depth'?'<p>Each line is one import, drawn lightly.</p>'
     :'<p>Thin lines are imports inside a box. A thick grey line is every import between two boxes, both directions, and its number is how many.</p>')
   +'<p>Point at a file to light its imports and importers; click to keep them lit, and again to open it. Point at a box’s title for what it imports from the others.</p>'
   +'<p>This repo has '+A+' areas, the count on the Overview; '+Math.min(drawn,A||drawn)+' hold code and are drawn here'+(A>drawn?', the other '+(A-drawn)+' hold only docs or config':'')+'. '
   +(DATA.nodes.length-N.length)+' docs and config files are in Files, not here: they have no imports to draw.</p>'
   +(BY==='cluster'&&loose?'<p>The '+loose+' files with no import edge found sit under “no cluster”. That is a question, not a verdict: a file loaded dynamically, or sourced through a variable, looks exactly like an unused one.</p>':'')
   +'</div></div>';
  L.querySelectorAll('.lg[data-a]').forEach(el=>el.onclick=()=>{const a=el.dataset.a;
    if(hidden.has(a))hidden.delete(a);else hidden.add(a);
    el.classList.toggle('off',hidden.has(a));el.setAttribute('aria-pressed',hidden.has(a)?'false':'true');
    layout();redraw();});
  L.classList.toggle('min',!LEG_OPEN);
  const t=$('lgt');if(t)t.onclick=()=>{LEG_OPEN=!LEG_OPEN;L.classList.toggle('min',!LEG_OPEN);
    t.textContent=LEG_OPEN?'Hide legend':'Legend';t.setAttribute('aria-expanded',String(LEG_OPEN));
    // The legend is beside the Map, not over it, so folding it gives the Map its width back.
    resize();};}
// Search answers where it can be seen: on the Map it highlights, anywhere else it opens the list.
$('q').addEventListener('input',e=>{setQuery(e.target.value);buildList(query.trim().toLowerCase());
  if(TAB!=='map'&&TAB!=='files')showTab('files');});
addEventListener('keydown',e=>{const t=e.target;
  if(e.key==='/'&&document.activeElement!==$('q')&&!(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))){e.preventDefault();$('q').focus();}
  if(e.key==='Escape'){$('q').blur();}
  // Rows, chips and legend entries are clickable spans, so they answer the keys a button would.
  if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.tagName!=='BUTTON'){e.preventDefault();t.click();}});
buildList('');buildAreas();buildGaps();buildNext();
paint();buildHud();buildLegend();resize();describe();
</script>
</body></html>
